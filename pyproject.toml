[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-explorer-cua"
version = "0.1.0"
description = "Discover-once, deterministic computer-use automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "playwright>=1.55,<2",
  "python-dotenv>=1.1,<2",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
web-explorer = "web_explorer.cli:app"
night-window = "target.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web_explorer", "target"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
