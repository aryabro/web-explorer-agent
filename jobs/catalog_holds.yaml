capability_id: catalog.read_title_holds
version: 1.0.0
title: Read holds on a catalog title
description: Searches the Monroe Township STELLA Vega catalog and returns the visible holds count for the first matching title.
goal: Search the STELLA catalog for the supplied title, open the first result, and read how many holds are on that title.
target: https://mon.search.stellanj.org/
product: stella-vega-discover
product_version: "1"
surface_kind: web
tenant: monroe-township-public-library
max_steps: 14
inputs:
  title:
    type: string
    description: Book title to search in the catalog.
    sensitivity: none
outputs:
  holds_count:
    type: string
    description: Visible holds count for the first matching title, as shown next to the word holds.
    sensitivity: none
business_outcomes:
  - code: TITLE_NOT_FOUND
    description: The catalog returned no matching titles for the supplied search.
    visible_text: Check your spelling and expand acronyms.
click_recoveries:
  - kind: dismiss_interstitial
    visible_text: Cookie Preference Center
    action_text: Close
discovery_hints:
  - Stay on the catalog task. Do not log in, do not place a hold, and do not
    open Library Website, Advanced Search, or staff-pick carousels.
  - If Cookie Preference Center is visible, click Close before searching.
  - On the STELLA home page, type title into the search combobox (accessible
    name "search", placeholder "Search"). When has_value=true, do not type
    again — click the button named "Search".
  - After search, wait for results. Open the first matching title link (for
    example "The dragonbone chair"). Do not click Place Holds, Request Any
    Edition, or Find a copy at another library.
  - On the title card, extract holds_count from the visible "N holds" message
    (data-automation-id holds-and-copies-message). Prefer the span that includes
    both the number and the word holds, not the copies figure and not Place Holds.
  - After the Search click, use checkpoint_text such as "result found" or the
    title. After opening the first result, use checkpoint_text such as "holds".
