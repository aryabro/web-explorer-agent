capability_id: member.read_savings_balance
version: 1.0.0
title: Read a member's savings balance
description: Signs into Test Bank Operations, opens a member profile, and returns the visible current savings balance.
goal: Sign in, find the supplied member number, and read the current savings balance.
target: http://127.0.0.1:8765/
product: night-window
product_version: "4.1"
surface_kind: legacy_web
vendor: training-credit-union
version_range: "4.x"
tenant: training-bay-17
max_steps: 14
inputs:
  operator_id:
    type: string
    description: Runtime teller/operator identifier.
    sensitivity: none
  pin:
    type: string
    description: Runtime-only sign-on PIN; the value is never persisted.
    sensitivity: secret
  member_id:
    type: string
    description: Five-digit fictional member number.
    sensitivity: identifier
outputs:
  savings_balance:
    type: string
    description: Current savings balance as displayed by the application.
    sensitivity: financial
business_outcomes:
  - code: MEMBER_NOT_FOUND
    description: No member profile exists for the supplied number.
    checkpoint:
      id: outcome-member-not-found
      kind: visible_text
      expected: NO MATCHING MEMBER
      frame: night-work
  - code: PERMISSION_DENIED
    description: The signed-in employee cannot access the member profile.
    checkpoint:
      id: outcome-permission-denied
      kind: visible_text
      expected: PERMISSION DENIED
      frame: night-work
fatal_states:
  - code: SESSION_EXPIRED
    description: Test Bank Operations ended the authenticated session.
    checkpoint:
      id: fatal-session-expired
      kind: visible_text
      expected: SESSION EXPIRED
      frame: night-work
click_recoveries:
  - trigger:
      id: recover-records-notice
      kind: visible_text
      expected: MEMBER INDEX NOTICE
    strategy: dismiss
    action_text: Continue search
    timeout_ms: 2000
    max_attempts: 1
  - trigger:
      id: recover-index-turning
      kind: visible_text
      expected: Searching...
    strategy: wait
    timeout_ms: 3000
    max_attempts: 1
preferred_frame: night-work
discovery_hints:
  - The console is a frameset with nested tables and no test ids; use adjacent labels.
  - Prefer the named work frame listed in the observation.
