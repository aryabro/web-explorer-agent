capability_id: member.read_savings_balance
version: 1.0.0
title: Read a member's savings balance
description: Signs into Night Window, opens a member jacket, and returns the visible current savings balance.
goal: Sign on, look up the supplied member number, and read the current savings balance.
target: http://127.0.0.1:8765/
product: night-window
product_version: "4.1"
surface_kind: legacy_web
tenant: training-bay-17
max_steps: 14
inputs:
  operator_id:
    type: string
    description: Runtime teller/operator identifier.
    sensitivity: none
  pin:
    type: string
    description: Runtime-only sign-on PIN; the value is never persisted.
    sensitivity: secret
  member_id:
    type: string
    description: Five-digit fictional member number.
    sensitivity: identifier
outputs:
  savings_balance:
    type: string
    description: Current savings balance as displayed by the application.
    sensitivity: financial
business_outcomes:
  - code: MEMBER_NOT_FOUND
    description: No member jacket exists for the supplied number.
    checkpoint:
      id: outcome-member-not-found
      kind: visible_text
      expected: NO MATCHING MEMBER
      frame: night-work
  - code: PERMISSION_DENIED
    description: The signed-in operator cannot access the member jacket.
    checkpoint:
      id: outcome-permission-denied
      kind: visible_text
      expected: PERMISSION DENIED
      frame: night-work
fatal_states:
  - code: SESSION_EXPIRED
    description: Night Window ended the authenticated session.
    checkpoint:
      id: fatal-session-expired
      kind: visible_text
      expected: SESSION EXPIRED
      frame: night-work
click_recoveries:
  - trigger:
      id: recover-records-notice
      kind: visible_text
      expected: NOTICE FROM RECORDS
    strategy: dismiss
    action_text: Continue lookup
    timeout_ms: 2000
    max_attempts: 1
  - trigger:
      id: recover-index-turning
      kind: visible_text
      expected: Index turning...
    strategy: wait
    timeout_ms: 3000
    max_attempts: 1
preferred_frame: night-work

