capability_id: member.open_sub_account
version: 1.0.0
title: Open a member sub-account
description: Signs in, opens a member jacket, reviews a new savings card, and creates it after confirmation.
goal: Open a new sub-account for the supplied member and reach the visible creation confirmation.
target: http://127.0.0.1:8765/
product: night-window
product_version: "4.1"
surface_kind: legacy_web
tenant: training-bay-17
max_steps: 20
inputs:
  operator_id:
    type: string
    description: Runtime teller/operator identifier.
    sensitivity: none
  pin:
    type: string
    description: Runtime-only sign-on PIN.
    sensitivity: secret
  member_id:
    type: string
    description: Five-digit fictional member number.
    sensitivity: identifier
  product:
    type: string
    description: Savings product label displayed in the product list.
    sensitivity: none
  nickname:
    type: string
    description: Nickname for the new account.
    sensitivity: pii
  opening_deposit:
    type: string
    description: Decimal opening deposit.
    sensitivity: financial
outputs:
  account_id:
    type: string
    description: Identifier displayed after account creation.
    sensitivity: identifier
business_outcomes:
  - code: MEMBER_NOT_FOUND
    description: No member jacket exists for the supplied number.
    checkpoint:
      id: outcome-member-not-found
      kind: visible_text
      expected: NO MATCHING MEMBER
      frame: night-work
  - code: PERMISSION_DENIED
    description: The signed-in operator cannot access the member jacket.
    checkpoint:
      id: outcome-permission-denied
      kind: visible_text
      expected: PERMISSION DENIED
      frame: night-work
fatal_states:
  - code: SESSION_EXPIRED
    description: Night Window ended the authenticated session.
    checkpoint:
      id: fatal-session-expired
      kind: visible_text
      expected: SESSION EXPIRED
      frame: night-work
click_recoveries:
  - trigger:
      id: recover-records-notice
      kind: visible_text
      expected: NOTICE FROM RECORDS
    strategy: dismiss
    action_text: Continue lookup
    timeout_ms: 2000
    max_attempts: 1
  - trigger:
      id: recover-index-turning
      kind: visible_text
      expected: Index turning...
    strategy: wait
    timeout_ms: 3000
    max_attempts: 1
preferred_frame: night-work

