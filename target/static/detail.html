<!doctype html>
<html>
<head>
  <title>Member profile</title>
  <link rel="stylesheet" href="/static/legacy.css">
  <script src="/static/app.js"></script>
</head>
<body>
  <div class="mast"><span>MEMBER SERVICES</span><small>Member profile</small></div>
  <div class="panel" data-content></div>
  <script>
    if (NightWindow.requireSession()) {
      const content = document.querySelector("[data-content]");
      const id = sessionStorage.getItem("night-window:selected-member") || "";
      const member = NightWindow.ledger().members[id];

      if (!member) {
        content.innerHTML = `
          <div class="warning"><b>NO MATCHING MEMBER</b><br>
          No profile exists for member number ${id.replace(/[^0-9]/g, "")}.</div>
          <p><a href="/search.html">Return to Member Search</a></p>`;
      } else if (member.status === "Restricted") {
        content.innerHTML = `
          <div class="warning"><b>PERMISSION DENIED</b><br>
          Your staff role cannot open this member profile.</div>
          <p><a href="/search.html">Return to Member Search</a></p>`;
      } else {
        const savings = member.accounts.find(account => account.product === "Savings");
        content.innerHTML = `
          <div class="page-intro"><h1>${member.name}</h1><p>Member ${member.memberId} · <span class="badge">${member.status}</span></p></div>
          <table class="form summary-table">
            <tr><td>Member number</td><td>${member.memberId}</td></tr>
            <tr><td>Member name</td><td>${member.name}</td></tr>
            <tr><td>Member status</td><td>${member.status}</td></tr>
            <tr><td>Relationship since</td><td>${member.since}</td></tr>
            <tr><td>Preferred contact</td><td>${member.contact}</td></tr>
          </table>
          <div class="section-heading"><h2>Accounts</h2><span>${member.accounts.length} open</span></div>
          <table class="form data-table">
            <tr><th>Account</th><th>Product</th><th>Nickname</th><th>Status</th><th>Current balance</th></tr>
            ${member.accounts.map(account => `<tr><td>${account.id}</td><td>${account.product}</td><td>${account.nickname}</td><td><span class="badge">Open</span></td><td class="money">$${account.balance.toFixed(2)}</td></tr>`).join("")}
          </table>
          <p class="success"><b>MEMBER PROFILE READY</b><br>
          Current savings balance: <strong>$${savings.balance.toFixed(2)}</strong></p>
          <p class="actions"><button class="primary">Open savings account</button> <a class="button-link" href="/search.html">Search another member</a></p>`;
        NightWindow.saltFields();
        content.querySelector("button").onclick = () => NightWindow.go("open-account");
      }
    }
  </script>
</body>
</html>
