<!doctype html>
<html>
<head>
  <title>Account created</title>
  <link rel="stylesheet" href="/static/legacy.css">
  <script src="/static/app.js"></script>
</head>
<body>
  <div class="mast"><span>ACCOUNT SERVICES</span><small>Complete</small></div>
  <div class="panel">
    <div class="success">
      <b>ACCOUNT CREATED</b><br>
      New account <span data-account></span> was added to the member profile.
    </div>
    <p><a data-return href="#">Return to member profile</a></p>
  </div>
  <script>
    if (NightWindow.requireSession()) {
      document.querySelector("[data-account]").textContent =
        sessionStorage.getItem("night-window:last-created") || "(unknown)";
      document.querySelector("[data-return]").onclick = function (event) {
        event.preventDefault();
        NightWindow.go("detail");
      };
    }
  </script>
</body>
</html>
