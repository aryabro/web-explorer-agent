<!doctype html>
<html>
<head>
  <title>Open savings account</title>
  <link rel="stylesheet" href="/static/legacy.css">
  <script src="/static/app.js"></script>
</head>
<body>
  <div class="mast"><span>ACCOUNT SERVICES</span><small>New savings account</small></div>
  <div class="page-intro"><h1>Open savings account</h1><p>Enter the account details, then review them before creation.</p></div>
  <div class="panel">
    <table class="form">
      <tr><td>Product</td><td><select><option>Holiday Savings</option><option>Share Savings</option></select></td></tr>
      <tr><td>Nickname</td><td><input maxlength="24" autocomplete="off"></td></tr>
      <tr><td>Opening deposit</td><td><input inputmode="decimal" value="0.00" autocomplete="off"></td></tr>
      <tr><td>Statement delivery</td><td><select><option>Electronic</option><option>Paper</option></select></td></tr>
      <tr><td colspan="2" class="actions"><button class="primary">Review account</button></td></tr>
    </table>
    <div class="warning hidden" data-message></div>
  </div>
  <script>
    if (NightWindow.requireSession()) {
      const product = document.querySelectorAll("select")[0];
      const delivery = document.querySelectorAll("select")[1];
      const inputs = document.querySelectorAll("input");
      NightWindow.saltFields();
      document.querySelector("button").onclick = function () {
        const deposit = Number(inputs[1].value);
        if (!inputs[0].value.trim() || !Number.isFinite(deposit) || deposit < 0) {
          const message = document.querySelector("[data-message]");
          message.textContent = "VALIDATION: supply a nickname and a non-negative opening deposit.";
          message.classList.remove("hidden");
          return;
        }
        sessionStorage.setItem("night-window:pending-account", JSON.stringify({
          product: product.value,
          nickname: inputs[0].value.trim(),
          balance: deposit,
          delivery: delivery.value
        }));
        NightWindow.go("confirm-account");
      };
    }
  </script>
</body>
</html>
