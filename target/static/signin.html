<!doctype html>
<html>
<head>
  <title>Staff sign in</title>
  <link rel="stylesheet" href="/static/legacy.css">
  <script src="/static/app.js"></script>
  <script src="/runtime-config.js"></script>
</head>
<body>
  <div class="mast"><span>SECURE ACCESS</span><small>Test Bank Operations</small></div>
  <div class="page-intro"><h1>Staff sign in</h1><p>Enter your employee credentials to access member services.</p></div>
  <div class="panel compact-panel">
    <table class="form">
      <tr><td>Employee ID</td><td><input autocomplete="off" size="22"></td></tr>
      <tr><td>Security PIN</td><td><input type="password" autocomplete="off" size="22"></td></tr>
      <tr><td>Location</td><td><select><option>Main office</option><option>Contact center</option></select></td></tr>
      <tr><td colspan="2" class="actions"><button class="primary">Sign in</button></td></tr>
    </table>
    <div class="warning hidden" data-message></div>
  </div>
  <script>
    const inputs = document.querySelectorAll("input");
    const button = document.querySelector("button");
    NightWindow.saltFields();
    if (sessionStorage.getItem("night-window:expired")) {
      sessionStorage.removeItem("night-window:expired");
      const message = document.querySelector("[data-message]");
      message.textContent = "SESSION EXPIRED: sign on again before continuing.";
      message.classList.remove("hidden");
    }
    button.onclick = function () {
      const expected = window.__NIGHT_WINDOW_PIN__;
      if (inputs[0].value.trim() && inputs[1].value === expected) {
        NightWindow.signIn(inputs[0].value.trim());
        NightWindow.go("search");
      } else {
        const message = document.querySelector("[data-message]");
        message.textContent = "SIGN-IN FAILED: employee ID or security PIN was not accepted.";
        message.classList.remove("hidden");
      }
    };
  </script>
</body>
</html>
