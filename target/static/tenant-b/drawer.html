<!doctype html>
<html>
<head>
  <title>Session evidence drawer</title>
  <link rel="stylesheet" href="/static/legacy.css">
  <script src="/static/app.js"></script>
</head>
<body>
  <div class="mast">DRAWER / EVIDENCE</div>
  <p class="dim">Independent test oracle. Automation must not use this pane to decide or declare production success.</p>
  <div class="panel">
    <b>SESSION LEDGER</b>
    <pre data-ledger></pre>
  </div>
  <div class="panel">
    <b>FAULT HARNESS</b>
    <p class="dim">For tests; fault state never appears in the URL.</p>
    <select>
      <option value="">none</option>
      <option value="interstitial">interstitial</option>
      <option value="slow">slow load</option>
      <option value="session_drop">session expiry</option>
    </select>
    <button>Arm once</button>
    <p data-fault class="dim"></p>
  </div>
  <script>
    const select = document.querySelector("select");
    const faultText = document.querySelector("[data-fault]");
    function render() {
      document.querySelector("[data-ledger]").textContent =
        JSON.stringify(NightWindow.ledger(), null, 2);
      faultText.textContent = `Armed: ${NightWindow.fault() || "none"}`;
    }
    document.querySelector("button").onclick = function () {
      if (select.value) sessionStorage.setItem(NightWindow.FAULT_KEY, select.value);
      else NightWindow.clearFault();
      render();
    };
    NightWindow.saltFields();
    render();
    setInterval(render, 500);
  </script>
</body>
</html>
