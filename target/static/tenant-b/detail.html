<!doctype html>
<html>
<head>
  <title>Member jacket</title>
  <link rel="stylesheet" href="/static/legacy.css">
  <script src="/static/app.js"></script>
</head>
<body>
  <div class="mast">MEMBER JACKET / ACCOUNT CARDS</div>
  <div class="panel" data-content></div>
  <script>
    if (NightWindow.requireSession()) {
      const content = document.querySelector("[data-content]");
      const id = sessionStorage.getItem("night-window:selected-member") || "";
      const member = NightWindow.ledger().members[id];

      if (!member) {
        content.innerHTML = `
          <div class="warning"><b>NO MATCHING MEMBER</b><br>
          No jacket exists for member number ${id.replace(/[^0-9]/g, "")}.</div>
          <p><a href="/tenant-b/search.html">Return to Member Search</a></p>`;
      } else if (member.status === "Restricted") {
        content.innerHTML = `
          <div class="warning"><b>PERMISSION DENIED</b><br>
          Your operator class may not open this member jacket.</div>
          <p><a href="/tenant-b/search.html">Return to Member Search</a></p>`;
      } else {
        const savings = member.accounts.find(account => account.product === "Savings");
        content.innerHTML = `
          <table class="form">
            <tr><td>Member number</td><td>${member.memberId}</td></tr>
            <tr><td>Member name</td><td>${member.name}</td></tr>
            <tr><td>Jacket status</td><td>${member.status}</td></tr>
          </table>
          <h3>ACCOUNT CARDS</h3>
          <table class="form">
            <tr><td>Account</td><td>Product</td><td>Nickname</td><td>Current balance</td></tr>
            ${member.accounts.map(account => `<tr><td>${account.id}</td><td>${account.product}</td><td>${account.nickname}</td><td>$${account.balance.toFixed(2)}</td></tr>`).join("")}
          </table>
          <p class="success"><b>SAVINGS BALANCE READY</b><br>
          Current savings balance: <strong>$${savings.balance.toFixed(2)}</strong></p>
          <p><button>Open another sub-account</button> &nbsp; <a href="/tenant-b/search.html">Search another member</a></p>`;
        NightWindow.saltFields();
        content.querySelector("button").onclick = () => NightWindow.go("open-account");
      }
    }
  </script>
</body>
</html>
